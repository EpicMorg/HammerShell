name: build

on:
  push:
    branches: [develop, master, 'feature/**']
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build HammerShell.sln -c Release
      - name: Test
        run: dotnet test --solution HammerShell.sln -c Release --no-build
      - name: Pack check
        run: dotnet pack src/HammerShell.Client/HammerShell.Client.csproj -c Release --no-build -o out
