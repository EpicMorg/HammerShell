name: release

# Push a tag like v0.1.0 to test, pack and publish EpicMorg.HammerShell.Client to NuGet and create a GitHub release
# (tags with a "-" suffix are marked as pre-release).
# Publishing uses NuGet Trusted Publishing (policy created by the nuget.org user stam, owned by EpicMorgDev, for this
# repository and release.yml): the job gets a short-lived API key through GitHub OIDC, no stored secret.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Test
        run: dotnet test --solution HammerShell.sln -c Release
      - name: Pack
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          dotnet pack src/HammerShell.Client/HammerShell.Client.csproj -c Release -p:Version=$version -o out
          Get-ChildItem out | Format-Table Name, Length
      - name: NuGet login (trusted publishing)
        id: nuget
        uses: NuGet/login@v1
        with:
          user: stam
      - name: Publish to NuGet
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          # the .snupkg next to each .nupkg is pushed with it
          foreach ($p in Get-ChildItem out -Filter *.nupkg) {
            dotnet nuget push $p.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "push failed: $($p.Name)" }
          }
      - name: GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $extra = @(); if ("${{ github.ref_name }}".Contains("-")) { $extra += "--prerelease" }
          gh release create "${{ github.ref_name }}" (Get-ChildItem out/*).FullName --title "HammerShell ${{ github.ref_name }}" --notes-file CHANGELOG.md @extra
